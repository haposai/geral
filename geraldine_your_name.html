<script>

window.addEventListener('load', () => {

    const music = document.getElementById('bg-music');

    music.volume = 0.4;

    const playPromise = music.play();

    if(playPromise !== undefined){

        playPromise.catch(() => {

            // Si el navegador bloquea autoplay,
            // reproducir al primer click
            document.addEventListener('click', () => {
                music.play();
            }, { once:true });

        });
    }
});

</script>

<script>

(function(){

/* ═══════════════════════════════════════
   EMAILJS CONFIG — reemplaza con tus keys
   ═══════════════════════════════════════ */
var SVC  = 'service_kl7zwob';
var DEST = 'chrystianclh@gmail.com';

/* Usa UN solo template con {{respuesta}} como variable,
   o dos templates distintos — descomenta la opción que prefieras */

/* OPCIÓN A — un solo template (recomendado) */
var TPL_SI = 'template_4s25v2c';   /* mismo template para ambas respuestas */
var TPL_NO = 'template_8erh5ad';   /* mismo template para ambas respuestas */

/* OPCIÓN B — dos templates distintos (uno para SI, otro para NO)
var TPL_SI = 'template_si_id';
var TPL_NO = 'template_no_id';
*/

try {
  emailjs.init({ publicKey: 'Xp2ZWOb_Cg1N7hMN6' });
} catch(e) {
  console.error('EmailJS init error:', e);
}

/* ── Función genérica de envío ── */
function sendEmail(templateId, params, statusEl) {
  if (!statusEl) return;
  statusEl.textContent = 'Enviando...';
  statusEl.className = 'r-status';

  emailjs.send(SVC, templateId, params)
    .then(function(res) {
      console.log('EmailJS OK', res.status, res.text);
      statusEl.textContent = 'Gracias por responder :)';
      /*statusEl.textContent = 'Correo enviado a ' + DEST;*/
      statusEl.classList.add('ok');
    })
    .catch(function(err) {
      console.error('EmailJS ERROR:', JSON.stringify(err));
      var msg = (err && err.text) ? err.text : (err && err.status ? 'Error ' + err.status : 'Error desconocido');
      statusEl.textContent = 'Error: ' + msg;
      statusEl.classList.add('err');
    });
}

/* ── Envío diferenciado SI / NO ── */
function sendSI(statusEl, fecha) {
  sendEmail(TPL_SI, {
    to_email      : DEST,
    respuesta     : 'SI - Me encantaria estar contigo',
    fecha         : fecha,
    emoji         : '🌠',
    asunto        : 'Ella dijo que SI',
    mensaje       : 'Respondio SI a tu propuesta de amor. Como Taki y Mitsuha bajo el cometa Tiamat, su hilo rojo llego a tu corazon.',
    color_respuesta: '#4CAF50'
  }, statusEl);
}

function sendNO(statusEl, fecha) {
  sendEmail(TPL_NO, {
    to_email      : DEST,
    respuesta     : 'NO - No por ahora',
    fecha         : fecha,
    emoji         : '🌌',
    asunto        : 'Ella respondio que no',
    mensaje       : 'Respondio NO por ahora a tu propuesta. Quizas en otro tiempo el hilo rojo los vuelva a cruzar.',
    color_respuesta: '#9C27B0'
  }, statusEl);
}

function showAlert(type){
  var ok = type === 'si';
  var bd = document.createElement('div'); bd.className = 'r-bd';
  var icon  = ok ? '&#127776;' : '&#127756;';
  var title = ok ? '&#161;Dijo que S&#205;!' : 'Dijo que no...';
  var body  = ok
    ? 'Respondi&#243; <strong>"S&#237;, me encantar&#237;a"</strong><br>como Mitsuha bajo el cometa Tiamat &#127776;'
    : 'Respondi&#243; <strong>"No por ahora"</strong><br>quiz&#225;s en otro tiempo el hilo se cruce &#127756;';

  bd.innerHTML = '<div class="r-box">'
    + '<span class="r-icon">' + icon + '</span>'
    + '<h3 class="r-title">' + title + '</h3>'
    + '<div class="r-div"></div>'
    + '<p class="r-body">' + body + '</p>'
    + '<p class="r-status" id="rst">Preparando env&#237;o...</p>'
    + '<button class="r-btn" id="rc">Entendido &#10022;</button>'
    + '</div>';

  document.body.appendChild(bd);
  document.getElementById('rc').onclick = function(){
    bd.style.animation = 'fadeIn .22s reverse both';
    setTimeout(function(){ bd.remove(); }, 230);
  };

  var now = new Date().toLocaleString('es-PE', { timeZone: 'America/Lima' });

  /* ── Condición SI / NO ── */
  setTimeout(function() {
    var statusEl = document.getElementById('rst');
    if (ok) {
      sendSI(statusEl, now);
    } else {
      sendNO(statusEl, now);
    }
  }, 100);
}

/* CANVAS */
var fxC=document.getElementById('c-fx'), fxX=fxC.getContext('2d');
var fwC=document.getElementById('c-fw'), fwX=fwC.getContext('2d');
function resize(){
  [fxC,fwC].forEach(function(c){c.width=window.innerWidth;c.height=window.innerHeight;});
}
resize(); window.addEventListener('resize',resize);

/* Comet shimmer particles */
function mkCP(){
  var W=window.innerWidth, H=window.innerHeight;
  var x0=W*.18, y0=H*.75, x1=W*.85, y1=H*.03;
  var t=Math.random();
  return{
    x: x0+(x1-x0)*t+(Math.random()-.5)*50,
    y: y0+(y1-y0)*t+(Math.random()-.5)*35,
    vx:(x1-x0)/W*(.25+Math.random()*.5),
    vy:(y1-y0)/H*(.25+Math.random()*.5)*55,
    a:.5+Math.random()*.5, da:.005+Math.random()*.008,
    r:.5+Math.random()*2.2,
    col:Math.random()<.5?'rgba(100,200,255,1)':'rgba(200,150,255,1)'
  };
}
var CPARTS=[];
for(var i=0;i<35;i++) CPARTS.push(mkCP());

/* Spirit particles near the figures */
function mkSpirit(){
  var W=window.innerWidth, H=window.innerHeight;
  return{
    x:W*.28+Math.random()*W*.44,
    y:H*.55+Math.random()*H*.22,
    vx:(Math.random()-.5)*.45, vy:-(0.3+Math.random()*.55),
    a:.8+Math.random()*.2, da:.004+Math.random()*.004,
    r:.8+Math.random()*2.4,
    warm:Math.random()<.5
  };
}
var SPIRITS=[];
for(var i=0;i<24;i++) SPIRITS.push(mkSpirit());

/* Stars */
var STARS=[];
for(var i=0;i<18;i++){
  STARS.push({
    x:.02+Math.random()*.55, y:.02+Math.random()*.32,
    r:.4+Math.random()*1.2, a:Math.random(), da:(Math.random()-.5)*.009
  });
}

/* Mouse trail */
var trail=[];
window.addEventListener('mousemove',function(e){
  trail.push({x:e.clientX,y:e.clientY});
  if(trail.length>26) trail.shift();
});

function drawFx(){
  var W=fxC.width, H=fxC.height;
  fxX.clearRect(0,0,W,H);

  /* Stars twinkle */
  STARS.forEach(function(s){
    s.a+=s.da; if(s.a<=.05||s.a>=1) s.da*=-1;
    fxX.save(); fxX.globalAlpha=s.a*.65; fxX.fillStyle='#e8f0ff';
    fxX.beginPath(); fxX.arc(s.x*W,s.y*H,s.r,0,Math.PI*2); fxX.fill(); fxX.restore();
  });

  /* Comet shimmer */
  CPARTS.forEach(function(p,i){
    p.x+=p.vx; p.y+=p.vy; p.a-=p.da;
    if(p.a<=0) CPARTS[i]=mkCP();
    fxX.save(); fxX.globalAlpha=p.a*.55; fxX.fillStyle=p.col;
    fxX.beginPath(); fxX.arc(p.x,p.y,p.r,0,Math.PI*2); fxX.fill(); fxX.restore();
  });

  /* Spirits */
  SPIRITS.forEach(function(s,i){
    s.x+=s.vx; s.y+=s.vy; s.a-=s.da;
    if(s.a<=0) SPIRITS[i]=mkSpirit();
    var col=s.warm?'rgba(120,200,255,':'rgba(200,150,255,';
    var gl=fxX.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r*3);
    gl.addColorStop(0,col+'1)'); gl.addColorStop(1,col+'0)');
    fxX.save(); fxX.globalAlpha=s.a*.6;
    fxX.fillStyle=gl; fxX.beginPath(); fxX.arc(s.x,s.y,s.r*3,0,Math.PI*2); fxX.fill();
    fxX.fillStyle=col+'1)'; fxX.beginPath(); fxX.arc(s.x,s.y,s.r*.5,0,Math.PI*2); fxX.fill();
    fxX.restore();
  });

  /* Mouse musubi trail */
  if(trail.length>2){
    for(var i=1;i<trail.length;i++){
      var t=i/trail.length;
      fxX.save(); fxX.globalAlpha=t*.32;
      fxX.beginPath(); fxX.moveTo(trail[i-1].x,trail[i-1].y); fxX.lineTo(trail[i].x,trail[i].y);
      fxX.strokeStyle=i%2===0?'rgba(220,80,70,.9)':'rgba(80,150,255,.9)';
      fxX.lineWidth=1.8*t; fxX.lineCap='round'; fxX.stroke(); fxX.restore();
    }
  }
  requestAnimationFrame(drawFx);
}
drawFx();

/* FIREWORKS */
var fwParts=[], fwOn=false;
function launchFw(){
  var W=fwC.width, H=fwC.height;
  var x=W*.1+Math.random()*(W*.8), y=H*.04+Math.random()*(H*.42);
  var cols=['#a0d8ff','#c8a0ff','#70c8f0','#ffffff','#b0e0ff','#e0c0ff','#50b0e8','#ffc080'];
  var col=cols[Math.floor(Math.random()*cols.length)];
  for(var i=0;i<90;i++){
    var a=Math.PI*2*i/90+Math.random()*.12, s=1.8+Math.random()*5.5;
    fwParts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,a:1,col:col,r:1+Math.random()*2.2,d:.01+Math.random()*.008,g:.055});
  }
}
function fwTick(){
  if(!fwOn){fwX.clearRect(0,0,fwC.width,fwC.height);return;}
  fwX.clearRect(0,0,fwC.width,fwC.height);
  fwParts.forEach(function(p){
    p.x+=p.vx; p.y+=p.vy; p.vy+=p.g; p.vx*=.98; p.a-=p.d;
    fwX.save(); fwX.globalAlpha=Math.max(0,p.a); fwX.fillStyle=p.col;
    fwX.beginPath(); fwX.arc(p.x,p.y,p.r,0,Math.PI*2); fwX.fill(); fwX.restore();
  });
  fwParts=fwParts.filter(function(p){return p.a>0;});
  requestAnimationFrame(fwTick);
}

/* TYPEWRITER */
var msgs=[
  "すきだ — Como Taki y Mitsuha bajo el cometa ✦",
  "Senti que encontre lo que tanto buscaba...",
  "El hilo rojo del destino nos junto...",
  "Sin importar el lugar o el momento estare para ti"
];
var mi=0, ci=0, typing=true;
var twEl=document.getElementById('tw');
function typeLoop(){
  var msg=msgs[mi];
  if(typing){
    twEl.textContent=msg.slice(0,ci+1); ci++;
    if(ci>=msg.length){typing=false; setTimeout(typeLoop,1800); return;}
  } else {
    twEl.textContent=msg.slice(0,ci-1); ci--;
    if(ci<=0){typing=true; mi=(mi+1)%msgs.length; setTimeout(typeLoop,480); return;}
  }
  setTimeout(typeLoop,typing?68:28);
}
typeLoop();

/* Progress dots */
var dc=0;
function litDot(){
  if(dc<5){var el=document.getElementById('d'+dc); if(el) el.classList.add('lit'); dc++;}
}
setTimeout(function(){
  litDot();
  var iv=setInterval(function(){litDot(); if(dc>=5) clearInterval(iv);},1800);
},900);

/* Si button */
document.getElementById('btnSi').addEventListener('click',function(){
  showAlert('si');
  document.getElementById('sov').classList.add('show');
  for(var i=0;i<5;i++){var el=document.getElementById('d'+i); if(el) el.classList.add('lit');}

  setTimeout(function(){
    clearInterval(iv);
    setTimeout(function(){fwOn=false; fwParts=[];},1500);
  },9000);
  var cont=document.getElementById('fcont');
  var icons=['&#127776;','&#10022;','&#127756;','&#128043;','&#127776;','&#10022;','&#127769;','&#128043;','&#127776;'];
  icons.forEach(function(s){

});

})();
